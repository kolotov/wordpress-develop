name: PHPUnit Tests

on:
  push:
    branches:
      - trunk
      - phpunit-13
  pull_request:
    branches:
      - trunk
      - phpunit-13
    paths:
      - '**.css'
      - '**.html'
      - '**.js'
      - '**.json'
      - '**.php'
      - 'src/license.txt'
      - 'src/SECURITY.md'
      - 'package*.json'
      - '.npmrc'
      - 'Gruntfile.js'
      - 'composer.*'
      - 'tests/phpunit/**'
      - 'tests/phpunit/multisite.xml'
      - 'phpunit.xml.dist'
      - '.github/workflows/phpunit-tests.yml'
      - '.github/workflows/reusable-phpunit-tests-*.yml'
      - '.github/workflows/reusable-prepare-gutenberg.yml'
      - 'tools/phpunit13/**'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  migration-audit:
    name: PHPUnit 13 migration audit
    if: ${{ github.ref == 'refs/heads/phpunit-13' || github.head_ref == 'phpunit-13' || github.base_ref == 'phpunit-13' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Audit migrated test contract in shared runtime
        env:
          CONTAINER_ENGINE: docker
        run: ./tools/phpunit13/run-audit.sh

  prepare-gutenberg:
    name: Prepare Gutenberg Assets
    uses: ./.github/workflows/reusable-prepare-gutenberg.yml
    permissions:
      contents: read
    if: |
      github.repository == 'kolotov/wordpress-develop' || (
        github.event_name == 'pull_request' && (
          ! github.event.repository.private ||
          ! github.event.pull_request.draft ||
          contains( github.event.pull_request.labels.*.name, 'Draft Workflow Runs' )
        )
      )

  # This fork validates the canonical PHPUnit 13 runtime declared by the
  # paired wp-phpunit runtime manifest.
  modern-runtime:
    name: ${{ matrix.label }}
    uses: ./.github/workflows/reusable-phpunit-tests-v3.yml
    needs: prepare-gutenberg
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Single site
            multisite: false
            memcached: false
            tests-domain: example.org
          - label: Multisite
            multisite: true
            memcached: false
            tests-domain: example.org
          - label: Single site with Memcached
            multisite: false
            memcached: true
            tests-domain: example.org
          - label: Multisite with Memcached
            multisite: true
            memcached: true
            tests-domain: example.org
          - label: Single site with port
            multisite: false
            memcached: false
            tests-domain: example.org:8889
          - label: Multisite with port
            multisite: true
            memcached: false
            tests-domain: example.org:8889
    with:
      multisite: ${{ matrix.multisite }}
      memcached: ${{ matrix.memcached }}
      phpunit-config: ${{ matrix.multisite && 'tests/phpunit/multisite.xml' || 'phpunit.xml.dist' }}
      tests-domain: ${{ matrix.tests-domain }}
      gutenberg-artifact: ${{ needs.prepare-gutenberg.result != 'skipped' }}
      gutenberg-sha: ${{ needs.prepare-gutenberg.outputs.gutenberg-sha }}

  html-api-test-groups:
    name: HTML API
    uses: ./.github/workflows/reusable-phpunit-tests-v3.yml
    needs: prepare-gutenberg
    permissions:
      contents: read
      packages: read
    with:
      multisite: false
      memcached: false
      phpunit-config: phpunit.xml.dist
      phpunit-test-groups: html-api-web-platform-tests
      gutenberg-artifact: ${{ needs.prepare-gutenberg.result != 'skipped' }}
      gutenberg-sha: ${{ needs.prepare-gutenberg.outputs.gutenberg-sha }}
