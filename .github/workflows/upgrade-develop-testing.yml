# Confirms that updating WordPress using WP-CLI works successfully.
#
# This workflow tests upgrading from a previous version to the current wordpress-develop checkout, not to a version available on WordPress.org.
name: Upgrade Develop Version Tests

on:
  push:
    branches:
      - trunk
      - '7.[0-9]'
    paths:
      # Any change to a source PHP file should run checks.
      - 'src/**.php'
      # Confirm any changes to relevant workflow files.
      - '.github/workflows/upgrade-develop-testing.yml'
      - '.github/workflows/reusable-upgrade-testing.yml'
  pull_request:
    branches:
      - trunk
      - '7.[0-9]'
    paths:
      # Any change to a source PHP file should run checks.
      - 'src/**.php'
      # Confirm any changes to relevant workflow files.
      - '.github/workflows/upgrade-develop-testing.yml'
      - '.github/workflows/reusable-upgrade-testing.yml'
  workflow_dispatch:

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name for pull requests
  # or the commit hash for any other events.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  # Build WordPress from the current branch ready for the upgrade tests.
  build:
    name: Build
    uses: ./.github/workflows/reusable-build-package.yml
    if: |
      github.repository == 'kolotov/wordpress-develop' || (
        github.event_name == 'pull_request' && (
          ! github.event.repository.private ||
          ! github.event.pull_request.draft ||
          contains( github.event.pull_request.labels.*.name, 'Draft Workflow Runs' )
        )
      )
    permissions:
      contents: read

# This fork supports the current WordPress 7.x line on PHP 8.5 only.
# Test upgrades from the released 7.x versions into the current development checkout.
  upgrade-tests-develop:
    name: Upgrade from ${{ matrix.wp }}
    uses: ./.github/workflows/reusable-upgrade-testing.yml
    if: ${{ github.repository == 'kolotov/wordpress-develop' }}
    needs: [ build ]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ 'ubuntu-24.04' ]
        php: [ '8.5' ]
        db-type: [ 'mysql' ]
        db-version: [ '5.7', '8.4' ]
        wp: [ '7.0', '7.1' ]
        multisite: [ false, true ]
    with:
      os: ${{ matrix.os }}
      php: ${{ matrix.php }}
      db-type: ${{ matrix.db-type }}
      db-version: ${{ matrix.db-version }}
      wp: ${{ matrix.wp }}
      new-version: develop
      multisite: ${{ matrix.multisite }}

  # Run a limited set of upgrade tests for the current branch on forks.
  upgrade-tests-develop-forks:
    name: Upgrade from ${{ matrix.wp }}
    uses: ./.github/workflows/reusable-upgrade-testing.yml
    # This job also runs for the push event, which has no draft state to check.
    if: |
      github.repository != 'kolotov/wordpress-develop' && (
        github.event_name != 'pull_request' ||
        ! github.event.repository.private ||
        ! github.event.pull_request.draft ||
        contains( github.event.pull_request.labels.*.name, 'Draft Workflow Runs' )
      )
    needs: [ build ]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ 'ubuntu-24.04' ]
        php: [ '8.5' ]
        db-type: [ 'mysql' ]
        db-version: [ '8.4' ]
        wp: [ '7.0', '7.1' ]
        multisite: [ false, true ]
    with:
      os: ${{ matrix.os }}
      php: ${{ matrix.php }}
      db-type: ${{ matrix.db-type }}
      db-version: ${{ matrix.db-version }}
      wp: ${{ matrix.wp }}
      new-version: develop
      multisite: ${{ matrix.multisite }}

  slack-notifications:
    name: Slack Notifications
    uses: ./.github/workflows/slack-notifications.yml
    permissions:
      actions: read
      contents: read
    needs: [ upgrade-tests-develop ]
    # Send Slack notifications for non-pull-request runs in this fork.
    if: ${{ github.repository == 'kolotov/wordpress-develop' && github.event_name != 'pull_request' && always() }}
    with:
      calling_status: ${{ contains( needs.*.result, 'cancelled' ) && 'cancelled' || contains( needs.*.result, 'failure' ) && 'failure' || 'success' }}
    secrets:
      SLACK_GHA_SUCCESS_WEBHOOK: ${{ secrets.SLACK_GHA_SUCCESS_WEBHOOK }}
      SLACK_GHA_CANCELLED_WEBHOOK: ${{ secrets.SLACK_GHA_CANCELLED_WEBHOOK }}
      SLACK_GHA_FIXED_WEBHOOK: ${{ secrets.SLACK_GHA_FIXED_WEBHOOK }}
      SLACK_GHA_FAILURE_WEBHOOK: ${{ secrets.SLACK_GHA_FAILURE_WEBHOOK }}
      SLACK_GHA_TIMEOUT_WEBHOOK: ${{ secrets.SLACK_GHA_TIMEOUT_WEBHOOK }}

  failed-workflow:
    name: Failed workflow tasks
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    needs: [ slack-notifications ]
    # Upstream automatic reruns remain disabled in this fork.
    if: |
      always() &&
      github.repository == 'WordPress/wordpress-develop' &&
      github.event_name != 'pull_request' &&
      github.run_attempt < 2 &&
      (
        contains( needs.*.result, 'cancelled' ) ||
        contains( needs.*.result, 'failure' )
      )

    steps:
      - name: Dispatch workflow run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 2
          retry-exempt-status-codes: 418
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'failed-workflow.yml',
              ref: 'trunk',
              inputs: {
                run_id: `${context.runId}`,
              }
            });
