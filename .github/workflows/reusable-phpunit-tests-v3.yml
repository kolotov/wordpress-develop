##
# Reusable PHPUnit 13 workflow for the modern WordPress runtime.
# The same WordPress-owned runner is used by Docker in CI and Podman locally.
##
name: Run PHPUnit tests

on:
  workflow_call:
    inputs:
      os:
        description: 'Operating system to run tests on'
        required: false
        type: string
        default: ubuntu-24.04
      multisite:
        description: 'Whether to run tests as multisite'
        required: false
        type: boolean
        default: false
      memcached:
        description: 'Whether to enable the Memcached object-cache drop-in'
        required: false
        type: boolean
        default: false
      phpunit-config:
        description: 'The PHPUnit configuration file to use'
        required: false
        type: string
        default: phpunit.xml.dist
      phpunit-test-groups:
        description: 'A PHPUnit group to run instead of the default matrix'
        required: false
        type: string
        default: ''
      tests-domain:
        description: 'Domain to use for tests'
        required: false
        type: string
        default: example.org
      coverage-report:
        description: 'Whether to generate a PCOV coverage report'
        required: false
        type: boolean
        default: false
      report:
        description: 'Whether to report trunk results to WordPress.org Hosting Tests'
        required: false
        type: boolean
        default: false
      gutenberg-artifact:
        description: 'Whether to download the prepared Gutenberg build artifact'
        required: false
        type: boolean
        default: false
      gutenberg-sha:
        description: 'Immutable Gutenberg source SHA verified by the calling workflow'
        required: false
        type: string
        default: ''
    secrets:
      CODECOV_TOKEN:
        description: 'Codecov token for coverage uploads'
        required: false
      WPT_REPORT_API_KEY:
        description: 'WordPress.org Hosting Tests API key'
        required: false

permissions: {}

jobs:
  phpunit-tests:
    name: PHPUnit 13 / ${{ inputs.multisite && 'multisite' || 'single site' }}${{ inputs.memcached && ' / memcached' || '' }}${{ inputs.phpunit-test-groups && format(' / {0}', inputs.phpunit-test-groups) || '' }}${{ 'example.org' != inputs.tests-domain && format(' / {0}', inputs.tests-domain) || '' }}${{ inputs.report && ' / reporting' || '' }}
    runs-on: ${{ vars.RUNNERS_NAME || inputs.os }}
    timeout-minutes: ${{ inputs.coverage-report && 120 || 60 }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      - name: Download prepared Gutenberg build
        if: ${{ inputs.gutenberg-artifact }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gutenberg-build
          path: gutenberg
          digest-mismatch: error

      - name: Checkout the WordPress Test Reporter
        if: ${{ github.ref == 'refs/heads/trunk' && inputs.report }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: WordPress/phpunit-test-runner
          path: test-runner
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Run canonical WordPress PHPUnit profile
        env:
          CONTAINER_ENGINE: docker
          WORDPRESS_PHPUNIT_CONFIG: ${{ inputs.phpunit-config }}
          WORDPRESS_PHPUNIT_MULTISITE: ${{ inputs.multisite }}
          WORDPRESS_PHPUNIT_MEMCACHED: ${{ inputs.memcached }}
          WORDPRESS_PHPUNIT_TESTS_DOMAIN: ${{ inputs.tests-domain }}
          WORDPRESS_PHPUNIT_TEST_GROUPS: ${{ inputs.phpunit-test-groups }}
          WORDPRESS_PHPUNIT_COVERAGE: ${{ inputs.coverage-report }}
          WORDPRESS_PHPUNIT_REPORT: ${{ github.ref == 'refs/heads/trunk' && inputs.report }}
          WPT_REPORT_API_KEY: ${{ secrets.WPT_REPORT_API_KEY }}
          GUTENBERG_EXPECTED_SHA: ${{ inputs.gutenberg-sha }}
        run: ./tools/phpunit13/run-profile.sh

      - name: Upload test coverage report to Codecov
        if: ${{ inputs.coverage-report }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: wp-code-coverage-${{ inputs.multisite && 'multisite' || 'single' }}-${{ github.sha }}.xml
          flags: ${{ inputs.multisite && 'multisite' || 'single' }},php
          fail_ci_if_error: true
